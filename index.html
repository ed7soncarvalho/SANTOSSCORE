<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><style>body{margin:0}</style></head><body>
<title>Santos FC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app de torcedor, menu inferior no celular e menu lateral no desktop. Preto, branco e cinzas. */
:root{
  --bg:#f2f2f0; --surface:#ffffff; --surface2:#e9e9e7; --line:#d6d6d3; --fg:#0c0c0d; --muted:#686a70;
  --accent:#0c0c0d; --on-accent:#ffffff; --good:#1d7a45; --bad:#b42318; --live:#d92d20;
  --hero:#0c0c0d; --hero-fg:#f4f4f2;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090a; --surface:#141416; --surface2:#1d1d20; --line:#2a2a2e; --fg:#f4f4f2; --muted:#9a9ba2;
  --accent:#f4f4f2; --on-accent:#0c0c0d; --good:#3ecf7e; --bad:#ff6b5e; --live:#ff4d3f; --hero:#141416; --hero-fg:#f4f4f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090a; --surface:#141416; --surface2:#1d1d20; --line:#2a2a2e; --fg:#f4f4f2; --muted:#9a9ba2;
  --accent:#f4f4f2; --on-accent:#0c0c0d; --good:#3ecf7e; --bad:#ff6b5e; --live:#ff4d3f; --hero:#141416; --hero-fg:#f4f4f2; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;font-weight:700;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Estrutura */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:780px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;padding:12px 0;background:var(--bg)}
.top .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.top .sp{flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.livepill{display:inline-flex;align-items:center;gap:6px;background:var(--live);color:#fff;font-weight:600;font-size:12px;padding:5px 10px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase}
.livepill::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:500;border-radius:10px}
.nav-i[aria-current="page"]{color:var(--fg)}
.nav-i[aria-current="page"] svg{stroke-width:2.4}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:6px;width:230px;flex:none;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;margin-bottom:20px;padding-left:8px}
  .side .nav-i{flex-direction:row;gap:12px;font-size:15px;padding:11px 12px}
  .side .nav-i[aria-current="page"]{background:var(--surface2)}
  .bottom{display:none}
  .main{padding-bottom:48px}
  .top .brand{display:none}
}

/* Componentes */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:24px}
.sec-h a,.link{font-size:13px;color:var(--muted);text-decoration:none;font-weight:500}
.sec-h a:hover,.link:hover{color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.urgent{background:var(--live);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.banner{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none;border:1px solid var(--line)}
.avatar.lg{width:84px;height:84px;font-size:36px}
.star{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.star.on{color:var(--fg)}
.star.on svg{fill:currentColor}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:center;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
td:nth-child(2),th:nth-child(2){text-align:left}
tbody tr+tr td{border-top:1px solid var(--line)}
tr.me td{background:var(--surface2);font-weight:700}
.z-lib td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.z-reb td:first-child{box-shadow:inset 3px 0 0 var(--bad)}

/* Hero do jogo */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:18px;padding:20px;position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 26px,transparent 26px 52px),
  radial-gradient(120% 90% at 85% 0%,rgba(255,255,255,.16),transparent 60%)}
.hero .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:600}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:16px 0 14px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;min-width:0}
.team span{overflow-wrap:anywhere}
.badge{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.94);color:#0c0c0d;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
.mt{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
.avatar{overflow:hidden}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;letter-spacing:.02em}
.cd{display:flex;justify-content:center;gap:10px}
.cd div{min-width:58px;text-align:center;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 6px}
.cd b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.cd small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;opacity:.85;margin-top:14px}

/* Cartao de partida */
.m{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left}
.m .d{font-size:12px;color:var(--muted);width:58px;line-height:1.25}
.m .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.m .sc{font-family:var(--display);font-weight:800;font-size:26px;display:flex;gap:8px;align-items:center}
.res{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.res.V{background:var(--good)}.res.E{background:var(--muted)}.res.D{background:var(--bad)}
.detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:14px}
.ev b{font-family:var(--display);font-size:18px}
.bar{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;font-size:13px;text-align:center}
.bar .tr{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;display:flex}
.bar .tr i{display:block;background:var(--accent)}
.bar .lbl{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:-4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:16px 10px;position:relative;width:100%}
.pcard .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.pcard .star{position:absolute;top:4px;right:4px}
.pcard .no{position:absolute;top:10px;left:12px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat3 b{display:block;font-family:var(--display);font-size:34px;line-height:1}
.stat3 small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.post{display:flex;gap:12px}
.post p{margin:6px 0 0;overflow-wrap:anywhere}
.menu a,.menu button{display:flex;align-items:center;gap:14px;padding:16px;width:100%;text-align:left;text-decoration:none;border-bottom:1px solid var(--line)}
.menu>*:last-child{border-bottom:0}
.menu{padding:0;overflow:hidden}
.tog{width:44px;height:26px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{transform:translateX(18px);background:var(--on-accent)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin:4px 0 14px}
.page-t{font-size:36px;margin:8px 0 4px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.where{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.free{background:var(--good);color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:90%}
@media (min-width:900px){.toast{bottom:32px}}

/* ===== Visual estilo app de placar ===== */
:root{--pitch-a:#1f6b3a;--pitch-b:#1a5c32;--yel:#f2c200;--red:#e5372b}
.top{border-bottom:1px solid var(--line);margin-bottom:6px}
.grp{margin-top:14px}
.gh{display:flex;align-items:center;gap:10px;padding:0 4px 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.gh i{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--fg)}
.gh svg.i{width:13px;height:13px}
.lst{padding:0;overflow:hidden}
.mr{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;padding:12px 16px;text-decoration:none;color:inherit}
.mr+.mr{border-top:1px solid var(--line)}
.mr:hover{background:var(--surface2)}
.mst{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.1;color:var(--muted)}
.mst b{font-weight:600;color:var(--fg);font-size:14px}
.mst.live b{color:var(--live)}
.mtm{display:flex;flex-direction:column;gap:8px;min-width:0}
.tr2{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}
.tr2.me{font-weight:700}
.nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msc{display:flex;flex-direction:column;gap:8px;text-align:right;min-width:22px}
.msc b{font-size:16px;font-weight:700;line-height:22px}
.msc b.lose{color:var(--muted);font-weight:500}
.msc span{line-height:22px}
.car{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.mc{flex:none;width:176px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px}
.mc small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .tr2{justify-content:space-between}
.mc .tr2 span.l{display:flex;align-items:center;gap:8px;min-width:0}
.mc .tr2 b{font-size:16px}
.mc .live{color:var(--live);font-weight:700}
a.hl{display:block;text-decoration:none;color:var(--hero-fg)}
/* Pagina da partida */
.mh{padding:14px 16px 18px}
.mh-top{display:flex;align-items:center;gap:10px;font-size:13px;opacity:.85}
.mh-top a{color:inherit;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12)}
.mh-main{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 0 8px}
.mh-t{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:600;min-width:0}
.mh-t span{overflow-wrap:anywhere}
.mh-sc{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;white-space:nowrap}
.mh-sc i{font-style:normal;opacity:.5;margin:0 4px}
.mh-sc.t{font-size:34px}
.mh-s{text-align:center;font-size:13px;opacity:.9;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:max-content;padding:12px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tl{display:flex;flex-direction:column}
.tl-r{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:6px;padding:8px 0;position:relative}
.tl-m{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.tl-s{font-size:14px;min-width:0;overflow-wrap:anywhere}
.tl-s.r{text-align:left}
.tl-s:not(.r){text-align:right}
.tl-t small{display:block;color:var(--muted);font-size:12px}
.tl-d{text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:10px 0;border-block:1px dashed var(--line);margin:6px 0}
.ev-g{width:18px;height:18px}
.cy,.cr{width:11px;height:15px;border-radius:2px;display:block}
.cy{background:var(--yel)}.cr{background:var(--red)}
.formtag{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 10px}
.pitch{position:relative;aspect-ratio:2/3;max-width:440px;margin:0 auto;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch-a) 0 12.5%,var(--pitch-b) 12.5% 25%)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.pl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:74px}
.pj{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#fff;color:#0c0c0d;border:2px solid #0c0c0d;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pl.o .pj{background:#0c0c0d;color:#fff;border-color:#fff}
.pl span{font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.8);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 16px;font-size:14px}
.bench div{display:flex;gap:10px;align-items:center}
.bench b{width:26px;text-align:center;font-family:var(--display);font-size:18px;color:var(--muted)}
.donut{width:160px;height:160px;display:block;margin:0 auto}
.dn{font-size:11px;fill:var(--muted);font-family:var(--body);text-transform:uppercase;letter-spacing:.06em}
.dcrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dcrow b{font-family:var(--display);font-size:44px;line-height:1}
.dcrow .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:70px}
.seg{display:inline-flex;background:var(--surface2);border-radius:99px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{padding:7px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.bottom{backdrop-filter:blur(12px)}
.nav-i[aria-current="page"] svg{stroke-width:2.4}
.hero .meta a{color:inherit}

.livebar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cm-l{padding:4px 16px}
.cm{display:grid;grid-template-columns:60px 1fr;gap:10px;padding:12px 0;font-size:14px;line-height:1.4}
.cm+.cm{border-top:1px solid var(--line)}
.cmm{color:var(--muted);font-weight:600;font-size:13px}
.cm.gol{font-weight:700}
.cm.gol .cmm{color:var(--fg)}
.cm.am .cmm::after{content:"";display:inline-block;width:8px;height:11px;background:var(--yel);border-radius:2px;margin-left:6px;vertical-align:-1px}
.cm.vm .cmm::after{content:"";display:inline-block;width:8px;height:11px;background:var(--red);border-radius:2px;margin-left:6px;vertical-align:-1px}
/* ===== Visual moderno ===== */
.hero.mh{background:radial-gradient(120% 90% at 50% -10%,#245c3c 0%,var(--hero) 64%);padding:14px 16px 20px}
.hero.mh::before{opacity:.5}
.ringbox{position:relative;width:138px;height:138px;display:grid;place-items:center}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .rt{fill:none;stroke:rgba(255,255,255,.16);stroke-width:5}
.ringbox .rp{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round}
.ringbox.live .rp{stroke:var(--live)}
.ringc{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.ringc .rc{font-size:13px;font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}
.ringc.liv .rc{color:#ff7b70}
.ringc .rs{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:.02em}
.ringc .rl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.mh-main{grid-template-columns:1fr auto 1fr;margin:10px 0 0}
.mh .badge{width:76px;height:76px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tabs button{text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.vplayer{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.vplayer iframe,.vplayer img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.vplayer button.vp{position:absolute;inset:0;display:grid;place-items:center;width:100%}
.vplay{width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;border:2px solid #fff}
.vplay::after{content:"";border-left:20px solid #fff;border-block:12px solid transparent;margin-left:6px}
.vbadge{position:absolute;left:12px;top:12px;background:var(--live);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:99px;text-transform:uppercase}
.vcap{margin:10px 2px 14px}
.vcap b{display:block;font-size:15px;line-height:1.3}
.vlist{display:flex;flex-direction:column;gap:6px}
.vi{display:grid;grid-template-columns:128px 1fr;gap:12px;text-align:left;padding:8px;border-radius:12px;width:100%;align-items:center}
.vi:hover,.vi[aria-current="true"]{background:var(--surface2)}
.vth{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--surface2)}
.vth img{width:100%;height:100%;object-fit:cover;display:block}
.vth em{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;font-style:normal;padding:1px 5px;border-radius:4px}
.vi b{font-size:14px;line-height:1.3;display:block;overflow-wrap:anywhere}
.vi small{color:var(--muted);font-size:12px}
.ytlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media (max-width:899px){
  .bottom{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;border:1px solid var(--line);padding:6px 6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .main{padding-bottom:110px}
}
/* ===== tabela ao vivo, noticias, jogador ===== */
.lv td{background:rgba(229,55,43,.12)}
.lchip{display:inline-block;background:var(--live);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:8px;white-space:nowrap}
.lchip em{font-style:normal;opacity:.85;margin-left:4px;font-weight:500}
.pup,.pdn{font-style:normal;font-size:10px;font-weight:700;margin-left:4px}
.pup{color:var(--good)}.pdn{color:var(--bad)}
.lgban{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;text-decoration:none;color:inherit}
.lgrow{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.lgrow b{font-variant-numeric:tabular-nums}
.nimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--surface2);display:block}
.cupgrid{display:flex;flex-direction:column;gap:10px}
.tie{display:flex;flex-direction:column;gap:8px}
.tie.me{border-color:var(--accent)}
.tie .tt{display:flex;align-items:center;gap:10px;justify-content:space-between;font-weight:600}
.tie .tt span.l{display:flex;align-items:center;gap:8px;min-width:0}
.tie .leg{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tie .adv{font-size:13px;font-weight:600}
/* ===== setoristas ===== */
.sset{display:flex;flex-direction:column;gap:12px}
.sbrow{display:flex;gap:10px;flex-wrap:wrap}
.sb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface2);color:var(--fg);text-decoration:none}
.sb:hover{border-color:var(--fg)}
.sb .si{width:19px;height:19px}
.sb.yt{color:#ff2d2d}.sb.ig{color:#e1306c}
.svid{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--surface2);border-radius:12px;padding:10px 12px}
.svid b{display:block;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.svid small{font-size:12px}
.vplaysm{width:30px;height:30px;border-radius:50%;background:#ff2d2d;flex:none;position:relative}
.vplaysm::after{content:"";position:absolute;left:12px;top:9px;border-left:9px solid #fff;border-block:6px solid transparent}
.sbub{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:inherit;text-align:center;font-size:12px;font-weight:500}
.sbub span{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i{text-decoration:none}
.bottom .nav-i{font-size:10px;padding:6px 0;min-width:0}
.bottom .nav-i span{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function layoutXI(r){
  const rank=p=>{p=(p||"").toUpperCase(); if(p==="G"||p==="GK")return 0; if(/^(CD|CB|RB|LB|SW|LWB|RWB|D)/.test(p))return 1; if(/^(DM|CDM)/.test(p))return 2; if(/^(CM|LM|RM|M)/.test(p))return 3; if(/^(AM|CAM)/.test(p))return 4; return 5;};
  const side=p=>{p=(p||"").toUpperCase(); return (/^L/.test(p)||/-L$/.test(p))?-1:(/^R/.test(p)||/-R$/.test(p))?1:0;};
  const st=[...r.starters]; const gk=st.find(p=>rank(p.pos)===0)||st.find(p=>p.place===1);
  const rest=st.filter(p=>p!==gk).sort((a,b)=>rank(a.pos)-rank(b.pos)||a.place-b.place);
  let rows=(r.formation||"").split("-").map(Number).filter(Boolean);
  if(rows.reduce((a,b)=>a+b,0)!==rest.length){const by={}; rest.forEach(p=>{const k=rank(p.pos); by[k]=(by[k]||0)+1;}); rows=Object.keys(by).sort().map(k=>by[k]);}

}

function tickCd(){
  document.querySelectorAll("[data-cd]").forEach(el=>{
    let d=Math.max(0,+el.dataset.cd-now()); const dd=Math.floor(d/D); d-=dd*D; const hh=Math.floor(d/H); d-=hh*H; const mm=Math.floor(d/MIN); d-=mm*MIN; const ss=Math.floor(d/1000);
    const v=[dd,hh,mm,ss].map(x=>String(x).padStart(2,"0")); el.querySelectorAll("b").forEach((b,i)=>b.textContent=v[i]);
  });
}
setInterval(tickCd,1000);

function nextHero(m){
  const home=m.h?SANTOS:m.opp, away=m.h?m.opp:SANTOS;
  const b=n=>tb(n,42);
  return `<a class="hero hl" href="#partida-${esc(m.id)}">
    <div class="eyebrow">Próximo jogo · ${esc(m.comp)}${m.rd?" · "+esc(m.rd):""}</div>
    <div class="vs"><div class="team"><div class="badge">${b(home)}</div><span>${esc(home)}</span></div><div class="muted" style="font-family:var(--display);font-size:26px;opacity:.6">VS</div><div class="team"><div class="badge">${b(away)}</div><span>${esc(away)}</span></div></div>
    ${countdownHTML(m.t)}
    <div class="meta"><span>${fmtDate(m.t)} · ${fmtTime(m.t)}</span><span>${esc(m.venue)}</span><span>${esc(m.tv)}</span></div>
  </a>`;
}
function liveTeam(k,L){return k==="S"?`<div class="team"><div class="badge">${tb("Santos",42)}</div><span>Santos</span></div>`:`<div class="team"><div class="badge">${tb(L.opp,42)}</div><span>${esc(L.opp)}</span></div>`;}
function liveHero(){
  const L=LIVE;
  return `<div class="hero" data-noRefresh-ok>
    <div class="row" style="justify-content:space-between"><span class="livepill">${L.done?"Encerrado":"Ao vivo"}</span><span class="eyebrow">${esc(L.comp||"")}</span></div>
    <div class="vs">${liveTeam(L.h!==false?"S":"O",L)}<div class="score num">${L.h!==false?L.s+" – "+L.o:L.o+" – "+L.s}</div>${liveTeam(L.h!==false?"O":"S",L)}</div>

  </div>`;

function isFav(id){return S.favP.includes(id);}
function age(b){if(!b)return null; const d=new Date(b), n=new Date(); let a=n.getFullYear()-d.getFullYear(); if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--; return a;}
function playerCard(p){
  return `<div class="card pcard" role="link" tabindex="0" data-go="jogador-${p.id}"><span class="no num">${esc(p.num)}</span>
    <button class="star ${isFav(p.id)?"on":""}" data-fav="${p.id}" aria-label="${isFav(p.id)?"Remover dos favoritos":"Favoritar"} ${esc(p.name)}" aria-pressed="${isFav(p.id)}">${ic("star")}</button>
    ${pavatar(p,"lg")}<div class="nm">${esc(p.name)}</div><div class="muted small">${esc(p.pos)}</div></div>`;
}
function postHTML(p){
  const s=S.sets.find(x=>x.handle===p.h); if(!s)return "";

V.jogador=(id)=>{
  const p=S.players.find(x=>x.id===id); if(!p)return `<div class="empty">Jogador não encontrado.</div>`;

  const na='<span class="muted">A preencher no Admin</span>';
  const gk=p.pos==="Goleiro", ex=p.extra;
  const COLS=gk?[["starts","Tit."],["saves","Defesas"],["goalsConceded","Gols sof."],["cleanSheet","Sem sofrer"],["yellowCards","Am."],["redCards","Verm."]]:[["starts","Tit."],["totalGoals","Gols"],["goalAssists","Assist."],["totalShots","Final."],["shotsOnTarget","No gol"],["foulsCommitted","Faltas"],["yellowCards","Am."],["redCards","Verm."]];

    if(!ex)stats=`<section class="sec"><div class="sec-h"><h2>Temporada 2026</h2></div><div class="empty">Carregando estatísticas…</div></section>`;
    else if(!ex.splits.length)stats=`<section class="sec"><div class="sec-h"><h2>Temporada 2026</h2></div><div class="empty">A ESPN não tem estatísticas deste jogador.</div></section>`;
    else stats=`<section class="sec"><div class="sec-h"><h2>Temporada 2026</h2></div>
      <div class="card stat3">${(gk?[["starts","Titular"],["saves","Defesas"],["cleanSheet","Sem sofrer"]]:[["starts","Titular"],["totalGoals","Gols"],["goalAssists","Assistências"]]).map(([k,l])=>`<div><b class="num">${sum(k)}</b><small>${l}</small></div>`).join("")}</div>
      <div class="table-wrap" style="margin-top:10px"><table class="num"><thead><tr><th>Competição</th>${COLS.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${ex.splits.map(x=>`<tr><td style="text-align:left">${esc(x.lg)}</td>${COLS.map(c=>`<td>${x.d[c[0]]||0}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="muted small" style="margin-top:6px">Fonte: ESPN. “Tit.” conta só os jogos em que o atleta começou jogando.</div></section>`;
  } else if(p.st){

  }
  const dados=[["Nome completo",esc(p.full||p.name)],["Nascimento",b?`${b} (${a} anos)`:null],["Nacionalidade",p.nat&&p.nat!=="—"?esc(p.nat):null],["Altura",p.h?esc(p.h):null],["Posição",esc(p.pos)],["Camisa",esc(p.num)],["Pé dominante",p.foot?esc(p.foot):null]].filter(([k,v])=>v||!REAL);
  const hist=(ex&&ex.hist&&ex.hist.length)?ex.hist:(p.hist||[]);

let campSel="Brasileirão";
const LASTCOMP={};
const COMPBASE=["Brasileirão","Copa do Brasil","Sul-Americana","Paulistão","Libertadores"];
function orderedComps(){
  const live=(LIVE&&LIVE.real&&!LIVE.done)?LIVE.comp:null;
  const last=c=>{const m=PAST.find(x=>x.comp===c); return Math.max(m?m.t:0,LASTCOMP[c]||0);};
  return [...COMPBASE].sort((a,b)=>((b===live)-(a===live))||(last(b)-last(a))||(COMPBASE.indexOf(a)-COMPBASE.indexOf(b)));
}
function sortT(a,b){if(a.rank&&b.rank)return a.rank-b.rank; return b.pts-a.pts||b.v-a.v||b.sg-a.sg||b.gp-a.gp;}
V.classificacao=()=>{
  const c=CAMP[campSel]||{info:"",phase:"",rows:null,bracket:[]};
  let body="";
  const liveOn=campSel==="Brasileirão"&&LGL.live.length>0;
  if(CUPSLUG[campSel]&&!c.rows){ loadCup(campSel); body=cupHTML(campSel); }
  else if(c.rows){
    body=(campSel==="Brasileirão"?outlookHTML():"")+(liveOn?`<div class="card lst" style="margin-bottom:12px">${liveRows()}</div>
      <div class="chips"><button class="chip" aria-pressed="${LV==="live"}" data-lv="live">Ao vivo (projeção)</button><button class="chip" aria-pressed="${LV==="off"}" data-lv="off">Oficial</button></div>
      <p class="muted small" style="margin:4px 0 10px">${LV==="live"?(LGL.incl?"A ESPN já soma os jogos em andamento na tabela.":"Projeção: cada jogo em andamento conta pelo placar atual, como se terminasse agora. ▲ e ▼ mostram quanto o time sobe ou desce em relação à tabela oficial."):"Tabela oficial: só conta jogos encerrados."}</p>`:"")
      +tableHTML(campSel,true)+`<p class="muted small" style="margin-top:8px">Faixa clara: vagas na Libertadores. Faixa vermelha: zona de rebaixamento.</p>`;
  } else if(!c.bracket||!c.bracket.length){
    body=`<div class="empty">Tabela não disponível. Veja abaixo os jogos do Santos.</div>`;
  } else {
    body=`<div class="stack">${c.bracket.map(([f,t])=>`<div class="card"><div class="muted small" style="text-transform:uppercase;letter-spacing:.08em">${f}</div><div style="margin-top:4px;font-weight:600">${esc(t)}</div></div>`).join("")}</div>`;
  }
  const nextC=NEXT.filter(m=>m.comp===campSel).slice(0,2), lastC=PAST.filter(m=>m.comp===campSel).slice(0,2);
  return `<h1 class="page-t">Classificação</h1>
    <div class="chips">${orderedComps().map(c=>`<button class="chip" aria-selected="${campSel===c}" data-comp="${c}">${c}</button>`).join("")}</div>
    <p class="muted small" style="margin:6px 0 12px">${esc(c.info||"")}${c.phase?" · "+esc(c.phase):""}</p>${body}
    ${(nextC.length||lastC.length)?`<section class="sec"><div class="sec-h"><h2>Jogos do Santos</h2></div><div class="card lst">${[...nextC,...lastC].map(matchRow).join("")}</div></section>`:""}
    ${REAL?"":`<section class="sec"><div class="sec-h"><h2>Temporadas anteriores</h2></div><div class="stack">${HIST.map(h=>`<div class="card row"><div class="num" style="font-family:var(--display);font-weight:800;font-size:28px;width:56px">${h.y}</div><div class="grow"><b>${esc(h.c)}</b><div class="muted small">${esc(h.desc)}</div></div><span class="tag">${esc(h.pos)}</span></div>`).join("")}</div></section>`}`;
};

V.mais=()=>`<h1 class="page-t">Mais</h1>
  <div class="card menu" style="margin-top:10px">
    <a href="#setoristas">${ic("x")}<span class="grow"><b>Setoristas no X</b><div class="muted small">Jornalistas e atletas</div></span></a>
    <a href="#onde-assistir">${ic("tv")}<span class="grow"><b>Onde assistir</b><div class="muted small">Canais e streaming</div></span></a>
    <a href="#sobre">${ic("info")}<span class="grow"><b>Sobre e créditos</b><div class="muted small">Fontes dos dados, imagens e avisos</div></span></a>
    <a href="#admin">${ic("gear")}<span class="grow"><b>Painel administrativo</b><div class="muted small">Perfis, fontes e jogadores</div></span></a>
  </div>
  <section class="sec"><div class="sec-h"><h2>Notificações</h2></div><div class="card stack">
    ${[["prejogo","Lembrete 1 hora antes do jogo"],["escal","Escalação divulgada"],["inicio","Início da partida"],["gol","Gols"],["intervalo","Intervalo"],["fim","Fim de jogo"]].map(([k,l])=>`<div class="row"><span class="grow">${l}</span><button class="tog" role="switch" aria-checked="${S.notif[k]!==false}" aria-label="${l}" data-notif="${k}"></button></div>`).join("")}
    <div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn ${(window.__OS?(osState()&&osState().opted):(S.push&&pushState()==="granted"))?"ghost":""} sm" data-act="push">${(window.__OS?(osState()&&osState().opted):(S.push&&pushState()==="granted"))?"Avisos do aparelho ativos":"Ativar avisos no aparelho"}</button><button class="btn ghost sm" data-act="test-goal">Testar aviso de gol</button></div>
    <div class="muted small">${window.__OS?"Com os avisos ativados, o gol chega como notificação do aparelho mesmo com o app fechado.":"Gols tocam um som, vibram o celular e aparecem na tela. Com a permissão, também chegam como notificação do aparelho enquanto a página estiver aberta."}${pushState()==="denied"?" O navegador bloqueou as notificações. Libere nas configurações do site.":""}</div></div></section>
  <section class="sec"><div class="sec-h"><h2>Aparência</h2></div><div class="chips">${[["auto","Automático"],["dark","Escuro"],["light","Claro"]].map(([k,l])=>`<button class="chip" aria-pressed="${S.theme===k}" data-theme-set="${k}">${l}</button>`).join("")}</div></section>`;

V.admin=()=>`<a class="back" href="#mais">${ic("back")}Mais</a><h1 class="page-t">Painel administrativo</h1>
  <p class="muted small" style="margin:0 0 4px">As alterações ficam salvas neste aparelho. A proteção por login entra junto com o backend.</p>

    <form class="card stack" id="f-set"><div class="form-grid">
      <label class="f">Perfil no X (@usuário)<input id="s-h" placeholder="usuario"></label>
      <label class="f">Canal no YouTube (link)<input id="s-y" placeholder="https://www.youtube.com/@canal"></label>
      <label class="f">Nome<input id="s-n" placeholder="Nome de exibição" required></label>
      <label class="f">Categoria<select id="s-c">${SETCATS.slice(1).map(c=>`<option>${c}</option>`).join("")}</select></label></div>
      <button class="btn" type="submit" style="align-self:flex-start">Cadastrar perfil</button></form>
    <div class="stack" style="margin-top:10px">${S.sets.map(s=>`<div class="card row"><div class="grow"><b>${esc(s.name)}</b><div class="muted small">@${esc(s.handle)} · ${esc(s.cat)}</div></div>
      <button class="tog" role="switch" aria-checked="${s.on}" aria-label="Ativar ${esc(s.name)}" data-sett="${s.id}"></button><button class="btn danger sm" data-dels="${s.id}">Remover</button></div>`).join("")}</div></section>
  <section class="sec"><div class="sec-h"><h2>Fontes de notícias</h2></div><div class="card stack">
    ${S.sources.map(s=>`<div class="row"><span class="grow">${esc(s.name)}</span><button class="tog" role="switch" aria-checked="${s.on}" aria-label="Ativar ${esc(s.name)}" data-srct="${s.id}"></button></div>`).join("")}
    <label class="f">Atualizar a cada<select id="a-int">${[1,5,10,15,30].map(n=>`<option value="${n}" ${S.interval===n?"selected":""}>${n} min</option>`).join("")}</select></label></div></section>
  <section class="sec"><div class="sec-h"><h2>Jogadores</h2></div>
    <form class="card stack" id="f-pl"><div class="form-grid">
      <label class="f">Nome<input id="p-n" required></label><label class="f">Camisa<input id="p-num" type="number" min="1" max="99" required></label>
      <label class="f">Posição<select id="p-pos">${POS.map(p=>`<option>${p}</option>`).join("")}</select></label>
      <label class="f">Nacionalidade<input id="p-nat" value="Brasil"></label></div>
      <button class="btn" type="submit" style="align-self:flex-start">Adicionar ao elenco</button></form>
    <div class="stack" style="margin-top:10px">${S.players.map(p=>`<div class="card row"><span class="num muted" style="width:28px">${esc(p.num)}</span><div class="grow"><b>${esc(p.name)}</b><div class="muted small">${esc(p.pos)}</div></div><button class="btn danger sm" data-delp="${p.id}">Remover</button></div>`).join("")}</div></section>
  <section class="sec"><div class="sec-h"><h2>Registro de sincronização</h2></div><div class="card stack small">${S.log.slice(0,8).map(l=>`<div class="row"><span class="muted num" style="width:48px">${fmtTime(l.t)}</span><span class="grow">${esc(l.m)}</span></div>`).join("")}
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-act="sync">Atualizar agora</button><button class="btn danger sm" data-act="reset">Restaurar dados de exemplo</button></div></div></section>`;

/* ---------- Roteador ---------- */
const NAV=[["inicio","Início","home"],["jogos","Jogos","ball"],["classificacao","Classificação","trophy"],["noticias","Notícias","news"],["elenco","Elenco","users"],["mais","Mais","menu"]];
const PARENT={sobre:"mais",setoristas:"mais","onde-assistir":"mais",admin:"mais",jogador:"elenco",partida:"jogos"};
function parseHash(){
  let h=decodeURIComponent(location.hash.replace(/^#/,""))||"inicio";
  if(h==="campeonatos")return ["classificacao",null];
  if(h.startsWith("jogador-"))return ["jogador",h.slice(8)];
  if(h.startsWith("jogos-"))return ["jogos",h.slice(6)];
  if(h.startsWith("partida-"))return ["partida",h.slice(8)];
  return [V[h]?h:"inicio",null];
}
function curView(){return parseHash()[0];}
function renderChrome(view){
  const cur=PARENT[view]||view;
  const items=NAV.map(([k,l,i])=>`<a class="nav-i" href="#${k}" ${cur===k?'aria-current="page"':""}>${ic(i)}<span>${l}</span></a>`).join("");
  $("#bottom").innerHTML=items;
  $("#side").innerHTML=`<div class="brand">${tb("Santos",34)}<span>Santos FC</span></div>`+items;
  $("#top").innerHTML=`<div class="brand">${tb("Santos",30)}<span>Santos FC</span></div><div class="sp"></div>${LIVE&&!LIVE.done?'<a href="#jogos" class="livepill" style="text-decoration:none">Ao vivo</a>':""}<button class="icon-btn" data-act="theme" aria-label="Alternar tema claro e escuro">${ic("sun")}</button>`;
}
let lastView=null, lastMatch=null;
function route(){
  const [v,arg]=parseHash();
  renderChrome(v);
  const y=window.scrollY, keepFocus=document.activeElement&&document.activeElement.id;
  const val=keepFocus==="nq"?$("#nq").value:null;
  const bn=$("#banner"); if(bn)bn.textContent=LOADING?"Buscando dados do Santos…":STALE?"Sem conexão com a fonte de dados. Mostrando os últimos dados salvos, de "+fmtDate(LASTSYNC)+" às "+fmtTime(LASTSYNC)+". Tentando de novo a cada minuto.":REAL?"Dados reais de jogos, tabela, elenco e placar ao vivo via ESPN (atualizado às "+fmtTime(LASTSYNC)+"). Notícias da ESPN Brasil. Publicações de setoristas ainda são exemplos.":"Versão de demonstração: sem conexão com a fonte de dados neste ambiente. Placares, notícias e publicações são exemplos.";
  if(LOADING){$("#view").innerHTML='<div class="empty" style="margin-top:24px">Carregando dados do Santos…</div>'; return;}
  if(v==="partida"&&arg!==lastMatch){const mm=findMatch(arg); MT=(mm&&liveOf(mm)&&!liveOf(mm).done)?"video":"partida"; MTEAM="S"; lastMatch=arg;}
  if(v==="classificacao"&&lastView!=="classificacao")campSel=orderedComps()[0];
  $("#view").innerHTML=V[v](arg);
  tickCd();
  if(lastView!==v+(arg||"")&&!(["inicio","jogos"].includes(v)&&LIVE&&lastView&&lastView.startsWith(v)))window.scrollTo(0,0); else window.scrollTo(0,y);
  lastView=v+(arg||"");
  if(keepFocus){const el=document.getElementById(keepFocus); if(el&&el.tagName==="INPUT"){el.focus(); const l=el.value.length; try{el.setSelectionRange(l,l)}catch(e){}}}
  document.title="Santos FC"+(v==="inicio"?"":" · "+(NAV.find(n=>n[0]===(PARENT[v]||v))||[0,v])[1]);
}
window.addEventListener("hashchange",route);

/* ---------- Eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  let el;
  if(el=t.closest("[data-fav]")){e.stopPropagation(); const id=el.dataset.fav; S.favP=isFav(id)?S.favP.filter(x=>x!==id):[...S.favP,id]; save(); route(); return;}
  if(el=t.closest("[data-favs]")){const id=el.dataset.favs; S.favS=S.favS.includes(id)?S.favS.filter(x=>x!==id):[...S.favS,id]; save(); route(); return;}
  if(el=t.closest("[data-vsel]")){VSEL[lastMatch]=el.dataset.vsel; VPLAY[lastMatch]=true; route(); return;}
  if(el=t.closest("[data-actp]")){const pid=el.dataset.pid; if(el.dataset.actp==="rmphoto"){delete S.photos[pid]; save(); route();} return;}
  if(el=t.closest("[data-lv]")){LV=el.dataset.lv; route(); return;}
  if(el=t.closest("[data-stage]")){CUPSTAGE[campSel]=el.dataset.stage; route(); return;}
  if(el=t.closest("[data-mt]")){MT=el.dataset.mt; route(); return;}
  if(el=t.closest("[data-mteam]")){MTEAM=el.dataset.mteam; route(); return;}
  if(el=t.closest("[data-go]")){location.hash=el.dataset.go; return;}
  if(el=t.closest("[data-cat]")){newsCat=el.dataset.cat; route(); return;}
  if(el=t.closest("[data-pos]")){posF=el.dataset.pos; route(); return;}
  if(el=t.closest("[data-comp]")){campSel=el.dataset.comp; route(); return;}
  if(el=t.closest("[data-setf]")){setF=el.dataset.setf; route(); return;}
  if(el=t.closest("[data-theme-set]")){S.theme=el.dataset.themeSet; applyTheme(); save(); route(); return;}
  if(el=t.closest("[data-notif]")){const k=el.dataset.notif; S.notif[k]=!(S.notif[k]!==false); save(); route(); return;}
  if(el=t.closest("[data-sett]")){const s=S.sets.find(x=>x.id===el.dataset.sett); s.on=!s.on; log((s.on?"Ativado: ":"Desativado: ")+s.name); route(); return;}
  if(el=t.closest("[data-srct]")){const s=S.sources.find(x=>x.id===el.dataset.srct); s.on=!s.on; log((s.on?"Fonte ativada: ":"Fonte desativada: ")+s.name); route(); return;}
  if(el=t.closest("[data-dels]")){const s=S.sets.find(x=>x.id===el.dataset.dels); S.sets=S.sets.filter(x=>x.id!==s.id); S.favS=S.favS.filter(x=>x!==s.id); log("Removido: "+s.name); toast("Perfil removido"); route(); return;}
  if(el=t.closest("[data-delp]")){const p=S.players.find(x=>x.id===el.dataset.delp); S.players=S.players.filter(x=>x.id!==p.id); S.favP=S.favP.filter(x=>x!==p.id); log("Jogador removido: "+p.name); toast("Jogador removido"); route(); return;}
  if(el=t.closest("[data-act]")){
    const a=el.dataset.act;
    if(a==="theme"){const dark=document.documentElement.getAttribute("data-theme")==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches); S.theme=dark?"light":"dark"; applyTheme(); save();}
    if(a==="toggle-img"){S.noimg=!S.noimg; save(); route(); return;}
    if(a==="live-start"){startLive();return;}
    if(a==="test-goal"){notify("GOL DO SANTOS!","Santos 1 x 0 Adversário · 17'",true);return;}
    if(a==="push"&&window.__OS){ (async()=>{try{await __OS.Notifications.requestPermission(); try{await __OS.User.PushSubscription.optIn();}catch(x){} const st=osState(); S.push=!!(st&&st.opted); save(); route(); toast(S.push?"Avisos ativados, até com o app fechado":"Permissão não concedida");}catch(e){toast("Não foi possível ativar os avisos");}})(); return;}
    if(a==="push"){ if(window.SFCNative){S.push=true; save(); route(); toast("Avisos ativados no app"); return;}
      if(pushState()==="unsupported"){toast("Este navegador não permite notificações aqui");return;}
      Promise.resolve(Notification.requestPermission()).then(r=>{S.push=r==="granted"; save(); route(); toast(r==="granted"?"Avisos do aparelho ativados":"Permissão não concedida");}).catch(()=>toast("Não foi possível pedir permissão")); return;}
    if(a==="live-reset"){LIVE=null; route(); return;}
    if(a==="sync"){ if(REAL){toast("Atualizando…"); loadReal().then(()=>{log("Sincronização concluída (ESPN)."); route(); toast("Dados atualizados");}).catch(()=>toast("Falha ao atualizar"));} else {log("Sem conexão com a fonte de dados neste ambiente."); toast("Dados reais indisponíveis aqui"); route();} }
    if(a==="reset"){S=defaults(); save(); applyTheme(); toast("Dados de exemplo restaurados"); route();}
  }
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-go][role]")&&!e.target.closest("button[data-fav]")&&e.target===document.activeElement){e.preventDefault(); location.hash=e.target.dataset.go;}
});
document.addEventListener("input",e=>{
  if(e.target.id==="nq"){newsQ=e.target.value; route();}
  if(e.target.id==="pq"){V._q=e.target.value; route();}
});
document.addEventListener("change",e=>{
  if(e.target.id==="ph-in"&&e.target.files&&e.target.files[0]){const pid=e.target.dataset.pid, f=e.target.files[0], rd=new FileReader();
    rd.onload=()=>{const im=new Image(); im.onload=()=>{const c=document.createElement("canvas"); c.width=c.height=160; const m=Math.min(im.width,im.height); c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);
      try{S.photos[pid]=c.toDataURL("image/jpeg",0.85); save(); toast("Foto atualizada"); route();}catch(x){toast("Não foi possível usar essa imagem");}}; im.onerror=()=>toast("Arquivo de imagem inválido"); im.src=rd.result;}; rd.readAsDataURL(f);}
  if(e.target.id==="a-int"){S.interval=+e.target.value; log("Intervalo de atualização: "+S.interval+" min"); route();}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="f-set"){
    const h=$("#s-h").value.trim().replace(/^@/,""), y=($("#s-y")&&$("#s-y").value.trim())||"", n=$("#s-n").value.trim(); if(!n||(!h&&!y)){toast("Informe o nome e o perfil do X ou o canal do YouTube");return;}
    if(h&&S.sets.some(s=>(s.handle||"").toLowerCase()===h.toLowerCase())){toast("Esse perfil já está cadastrado");return;}
    S.sets.push({id:"s"+now(),custom:true,handle:h,name:n,cat:$("#s-c").value,on:true,yt:/^https?:\/\//.test(y)?y:""}); log("Cadastrado: "+n); toast("Perfil cadastrado"); route();
  }
  if(e.target.id==="f-pl"){
    const n=$("#p-n").value.trim(); if(!n)return;
    let id=slug(n); if(S.players.some(p=>p.id===id))id+="-"+now();
    S.players.push({custom:true,id,name:n,num:+$("#p-num").value,pos:$("#p-pos").value,nat:$("#p-nat").value.trim()||"Brasil",st:{j:0,g:0,a:0}}); log("Jogador adicionado: "+n); toast("Jogador adicionado"); route();
  }
});

initPush();
route();
loadReal().then(()=>{LOADING=false; log("Dados reais carregados da ESPN."); route(); pollLive(); pollLeague(); loadNews().then(()=>route()).catch(()=>{}); setInterval(()=>{loadNews().then(()=>{if(["noticias","inicio"].includes(curView()))route();}).catch(()=>{});},300000); setInterval(refreshStandings,600000);}).catch(()=>{LOADING=false; if(loadCache()){log("Fonte fora do ar. Usando dados salvos.");} route();});
setInterval(remindTick,30000);
setInterval(()=>{if(STALE)loadReal().then(()=>{log("Fonte voltou."); route(); pollLive(); pollLeague();}).catch(()=>{});},60000);
})();
</script>

<script>try{if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}catch(e){}</script>
